# app 名は `fly launch --name` で上書きされる。リージョンは東京(nrt)。
app = "tradeexperience-CHANGE-ME"
primary_region = "nrt"

[build]

[env]
  TRADING_MODE = "paper"
  JOURNAL_PATH = "/srv/data/journal.jsonl"

[mounts]
  source = "data"
  destination = "/srv/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Webhookをいつでも受けられるよう、止めない・常に1台動かす
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

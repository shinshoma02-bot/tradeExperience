# fly.toml app configuration file generated for tradeexperience on 2026-10-28T02:01:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tradeexperience'
primary_region = 'nrt'

[build]

[env]
  JOURNAL_PATH = '/srv/data/journal.jsonl'
  RUNNER_ENABLED = 'true'
  TRADING_MODE = 'paper'

[[mounts]]
  source = 'data'
  destination = '/srv/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
